[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastflights-mcp"
version = "0.1.0.dev0"
description = "MCP server for flight search with SearchApi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "httpx", "pydantic", "airportsdata==20260905", "tzdata"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
fastflights-mcp = "fastflights_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
